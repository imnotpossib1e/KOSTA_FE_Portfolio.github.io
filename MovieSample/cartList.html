<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Insert title here</title>
    <link rel="stylesheet" type="text/css" href="css/basic.css" />
    <style type="text/css">
      .poster {
        width: 150px;
        height: 150px;
      }

      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <button name="delItem">삭제</button>
    <hr />
    <article class="main">
      <section>
        <table width="80%" align="center">
          <caption class="caption">
            찜 리스트
          </caption>
          <thead>
            <tr>
              <th>이미지</th>
              <th>상품번호</th>
              <th>상품이름</th>
              <th>가격</th>
              <th>삭제</th>
            </tr>
          </thead>
          <tbody id="content">
            <!-- 찜목록 출력 -->
          </tbody>
        </table>
      </section>
      <section class="toalprice" id="price">
        <!-- 가격 -->
      </section>
      <section class="link">
        <table align="center">
          <tr>
            <td align="center">
              <a href="">주문하러 가기</a>
              <a href="index.html">DVD LIST</a>
            </td>
          </tr>
        </table>
      </section>
    </article>

    <script>
      // 삭제되었을 때 재갱신하기 위해 함수로 만든다
      let totalPrice = 0;
      const refreshPage = () => {
        // localStorage에서 찜 목록 불러오기
        for (let i = 0; i < localStorage.length; i++) {
          let key = localStorage.key(i);
          let data = localStorage.getItem(key).split(',');
          let image = data[1];
          let name = data[0];
          let price = parseInt(data[2]);
          totalPrice += price;

          // 테이블에 추가하기
          const row = document.querySelector('table').insertRow(); // <tr> 생성
          const imageCell = row.insertCell(0); // <td> 추가
          const idCell = row.insertCell(1); // <td> 추가
          const nameCell = row.insertCell(2); // <td> 추가
          const priceCell = row.insertCell(3); // <td> 추가
          const deleteCell = row.insertCell(4); // <td> 추가

          // cell1.innerHTML = `<input type="text" name='name' value='이름'>`;
          imageCell.innerHTML = `<img class="poster" src="${image}"></img>`;
          idCell.innerHTML = `<span>${key}</span>`;
          nameCell.innerHTML = `<span>${name}</span>`;
          priceCell.innerHTML = `<span>${price.toLocaleString()}</span>`;
          deleteCell.innerHTML = `<input type="button" data-key="${key}" value="삭제">`;
        }
        // 총 가격
        document.querySelector('#price').innerHTML =
          `<span>주문 가격 : ${totalPrice.toLocaleString() ?? 0}</span>`;
      };

      // 삭제 버튼
      // 동적으로 생성된 element에 이벤트 적용
      document.body.addEventListener('click', (event) => {
        if (event.target.matches('[value=삭제]')) {
          let key = event.target.dataset.key;

          let data = localStorage.getItem(key).split(',');
          totalPrice -= parseInt(data[2]);
          document.querySelector('#price').innerHTML =
            `<span>${totalPrice}</span>`;

          // 로컬스토리지 삭제
          localStorage.removeItem(key);
          console.log();
          // tr 삭제 -> refreshPage를 다시 소환해도 된다.
          let tr = event.target.parentElement.parentElement;
          tr.parentElement.removeChild(tr);
        }
      });

      refreshPage();
    </script>
  </body>
</html>
